name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AvtomaticAgent-v0.3.0.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvtomaticAgent-v0.3.0
          path: AvtomaticAgent-v0.3.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 AvtomaticAgent-v0.3.0.apk --clobber
          else
            gh release create v0.3.0 AvtomaticAgent-v0.3.0.apk \
              --title "AvtomaticAgent v0.3.0" \
              --notes "Debug APK built automatically from the current Android source."
          fi
