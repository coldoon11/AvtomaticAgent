name: Build Android APK

on:
  push:
    branches: [ main, v0.6-wake ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check voice gateway Python syntax
        run: python3 -m py_compile server/main.py server/api.py

      - name: Install Android API 36
        shell: bash
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDKROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platform-tools"

      - name: Download MediaPipe hand model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            -o app/src/main/assets/hand_landmarker.task
          test -s app/src/main/assets/hand_landmarker.task

      - name: Download Vosk Russian mobile model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 \
            "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" \
            -o /tmp/vosk-ru.zip
          rm -rf /tmp/vosk-ru app/src/main/assets/model-ru
          mkdir -p /tmp/vosk-ru
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru
          mv /tmp/vosk-ru/vosk-model-small-ru-0.22 app/src/main/assets/model-ru
          python3 - <<'PY' > app/src/main/assets/model-ru/uuid
          import uuid
          print(uuid.uuid4())
          PY
          test -s app/src/main/assets/model-ru/am/final.mdl
          test -s app/src/main/assets/model-ru/uuid

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AvtomaticAgent-v0.6.0.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvtomaticAgent-v0.6.0
          path: AvtomaticAgent-v0.6.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.0 >/dev/null 2>&1; then
            gh release upload v0.6.0 AvtomaticAgent-v0.6.0.apk --clobber
          else
            gh release create v0.6.0 AvtomaticAgent-v0.6.0.apk \
              --title "AvtomaticAgent v0.6.0" \
              --notes "Background offline wake phrase, modern minimalist UI, AI calls, messaging agent and hand gestures."
          fi
