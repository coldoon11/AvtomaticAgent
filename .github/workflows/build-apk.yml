name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check voice gateway Python syntax
        run: python3 -m py_compile server/main.py server/api.py

      - name: Install Android API 36
        shell: bash
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDKROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platform-tools"

      - name: Download MediaPipe hand model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            -o app/src/main/assets/hand_landmarker.task
          test -s app/src/main/assets/hand_landmarker.task

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AvtomaticAgent-v0.5.0.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvtomaticAgent-v0.5.0
          path: AvtomaticAgent-v0.5.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 AvtomaticAgent-v0.5.0.apk --clobber
          else
            gh release create v0.5.0 AvtomaticAgent-v0.5.0.apk \
              --title "AvtomaticAgent v0.5.0" \
              --notes "OpenAI Live SIP voice-agent gateway, outbound/inbound AI calls, unified chat, message agent and hand gestures."
          fi
